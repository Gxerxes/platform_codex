spring:
  application:
    name: palette-bff

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{36} correlationId=%X{correlationId:-} - %msg%n"
